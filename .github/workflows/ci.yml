name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar tests
        run: npm test

  # Check agregador con nombre estable "CI": es el que se marca como obligatorio
  # en la protección de rama, sin depender de la matriz de versiones de Node.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: test
    if: ${{ always() }}
    steps:
      - name: Verificar resultado de los tests
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          echo "Resultado de los tests: $TEST_RESULT"
          test "$TEST_RESULT" = "success"
